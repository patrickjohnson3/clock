<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centered Clock</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="matrix"></canvas>
    <div id="clock" role="group" tabindex="0"></div>

    <div id="controls">
      <button id="collapseBtn">Hide Panel</button>
      <div class="controls-columns">
        <section class="controls-section">
          <h2>General</h2>
          <label>
            Display Mode
            <select id="modeSelect">
              <option value="dark">Dark Mode</option>
              <option value="light">Light Mode</option>
              <option value="matrix">Matrix Mode (Green)</option>
            </select>
          </label>
          <label>
            Font
            <select id="fontSelect">
              <option
                value="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
              >
                System
              </option>
              <option value="'Space Mono', monospace">Space Mono</option>
              <option value="'IBM Plex Mono', monospace">IBM Plex Mono</option>
              <option value="'Roboto Mono', monospace">Roboto Mono</option>
              <option value="'Source Code Pro', monospace">
                Source Code Pro
              </option>
              <option value="'JetBrains Mono', monospace">
                JetBrains Mono
              </option>
              <option value="'Fira Mono', monospace">Fira Mono</option>
            </select>
          </label>
          <label
            ><input
              type="checkbox"
              id="fullscreenToggle"
              aria-describedby="fullscreenStatus"
            />
            Fullscreen</label
          >
          <p id="fullscreenStatus"></p>
          <label
            ><input
              type="checkbox"
              id="wakeLockToggle"
              aria-describedby="wakeLockStatus"
              checked
            />
            Keep Screen Awake</label
          >
          <p id="wakeLockStatus"></p>
          <label
            ><input
              type="checkbox"
              id="storageToggle"
              aria-describedby="storageStatus"
            />
            Remember settings on this device</label
          >
          <p id="storageStatus"></p>
          <h2>Clock</h2>
          <div class="range-control">
            <label for="clockScaleSlider">Clock Size (%)</label>
            <output id="clockScaleOutput" for="clockScaleSlider" aria-live="off"
              >100%</output
            >
            <input
              type="range"
              id="clockScaleSlider"
              min="100"
              max="200"
              step="10"
              value="100"
            />
          </div>
          <label
            ><input type="checkbox" id="hour24Toggle" /> 24-Hour Mode</label
          >
          <label
            ><input
              type="checkbox"
              id="showAmPmToggle"
              aria-describedby="showAmPmHint"
            />
            Show AM/PM</label
          >
          <p id="showAmPmHint" hidden>AM/PM is only shown in 12-hour mode.</p>
          <label
            ><input type="checkbox" id="leadingZeroToggle" /> Leading
            Zero</label
          >
          <label
            ><input type="checkbox" id="hideSecondsToggle" /> Hide
            Seconds</label
          >
        </section>

        <section class="controls-section">
          <h2>Matrix</h2>
          <label
            ><input
              type="checkbox"
              id="matrixToggle"
              aria-describedby="matrixModeHint"
            />
            Matrix Rain</label
          >
          <label
            ><input
              type="checkbox"
              id="neonToggle"
              aria-describedby="matrixModeHint"
            />
            Neon FX</label
          >
          <p id="matrixModeHint" hidden>
            Matrix mode keeps rain and neon on. Choose Dark or Light mode to
            adjust them separately.
          </p>
          <label><input type="checkbox" id="glowToggle" /> Clock Glow</label>
          <label><input type="checkbox" id="glitchToggle" /> Glitch FX</label>
          <label
            ><input type="checkbox" id="glyphToggle" /> Matrix Glyph
            Filter</label
          >
        </section>

        <section class="controls-section">
          <h2>Sound</h2>
          <p id="soundStatus"></p>
          <label
            ><input
              type="checkbox"
              id="brownNoiseToggle"
              aria-describedby="soundStatus"
            />
            Brown Noise</label
          >
          <label
            ><input
              type="checkbox"
              id="rainStormToggle"
              aria-describedby="soundStatus"
            />
            Rain Storm</label
          >
          <label
            ><input
              type="checkbox"
              id="aircraftCabinToggle"
              aria-describedby="soundStatus"
            />
            Aircraft Cabin</label
          >
          <label
            ><input
              type="checkbox"
              id="pinkNoiseToggle"
              aria-describedby="soundStatus"
            />
            Pink Noise</label
          >
          <label
            ><input
              type="checkbox"
              id="dubTechnoToggle"
              aria-describedby="soundStatus"
            />
            Dub Techno</label
          >
          <div class="range-control">
            <label for="soundVolumeSlider">Sound Volume</label>
            <output
              id="soundVolumeOutput"
              for="soundVolumeSlider"
              aria-live="off"
              >100%</output
            >
            <input
              type="range"
              id="soundVolumeSlider"
              min="0"
              max="100"
              step="1"
              value="100"
            />
          </div>
        </section>
      </div>
    </div>
    <button id="panelTab" aria-label="Show panel" inert></button>
    <div class="visually-hidden">
      <p id="wakeLockAnnouncement" role="status"></p>
      <p id="storageAnnouncement" role="status"></p>
      <p id="soundAnnouncement" role="status"></p>
      <p id="fullscreenAnnouncement" role="status"></p>
    </div>
    <p id="panelNotice"></p>

    <script type="module" src="app.js"></script>
  </body>
</html>
